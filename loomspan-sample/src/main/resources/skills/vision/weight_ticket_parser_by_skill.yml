name: weightTicketParserBySkill
description: >
  Parses a certified truck scale ticket image directly through the skill's
  configured OpenAI GPT-5 mini model. No Java parser backs this skill.
model: openai-gpt-5-mini
planning_mode: false
prompt: |
  Act as a high-precision document parser for certified truck scale tickets.

  CRITICAL GUIDELINES:

  This CAT Scale ticket contains printed labels, dot-matrix values, and a
  handwritten signature. Read each value from its labeled region and preserve
  identifiers as strings.

  EXTRACTION GOALS:
  1. TICKET DETAILS: Extract the ticket number, local weigh date and time,
     scale number, and complete scale location.
  2. AXLE WEIGHTS: Extract steer, drive, trailer, and certified gross weights
     in pounds from the right side.

  LOGIC AND VALIDATION:
  - WEIGHT CHECK: Verify that steer axle + drive axle + trailer axle = gross
    weight. Use the printed gross value as the source of truth; never alter a
    legible value merely to make the arithmetic work.
  - DO NOT GUESS: If a field is missing, illegible, or uncertain, return null.
    Never invent values to satisfy the schema.
  - NORMALIZATION: Return weighed_at_local as yyyy-MM-dd'T'HH:mm (infer 20xx
    for a two-digit year), weights as integer pounds, and scale_location as the
    printed facility and address lines joined with commas.
input_schema:
  type: object
  required:
    - image
  additionalProperties: false
  properties:
    image:
      type: attachment
      media_type: image
      allowed_content_types:
        - image/jpeg
      description: Certified truck scale ticket image.
output_schema:
  type: object
  properties:
    ticket_number:
      type: string
      nullable: true
      description: Ticket number printed at the upper left. Null if not legible.
    weighed_at_local:
      type: string
      nullable: true
      description: Combined ticket date and time as yyyy-MM-dd'T'HH:mm. Infer 20xx for a two-digit year. Null if not legible.
    scale_number:
      type: string
      nullable: true
      description: Scale identifier beside the SCALE label. Null if not legible.
    scale_location:
      type: string
      nullable: true
      description: Complete printed scale facility and address, with lines joined by commas. Null if not legible.
    steer_axle_weight_lb:
      type: integer
      nullable: true
      description: Steer axle weight in pounds. Null if not legible.
    drive_axle_weight_lb:
      type: integer
      nullable: true
      description: Drive axle weight in pounds. Null if not legible.
    trailer_axle_weight_lb:
      type: integer
      nullable: true
      description: Trailer axle weight in pounds. Null if not legible.
    gross_weight_lb:
      type: integer
      nullable: true
      description: Certified gross weight in pounds. Null if not legible.
  required:
    - ticket_number
    - weighed_at_local
    - scale_number
    - scale_location
    - steer_axle_weight_lb
    - drive_axle_weight_lb
    - trailer_axle_weight_lb
    - gross_weight_lb
  additionalProperties: false
output_schema_max_retries: 2
linter:
  type: regex
  max_retries: 1
  regex:
    pattern: '^\{[\s\S]*\}$'
    message: Return raw JSON only.
