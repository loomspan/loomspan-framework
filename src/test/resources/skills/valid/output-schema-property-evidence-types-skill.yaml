name: outputSchemaPropertyEvidenceTypesSkill
description: Skill with evidence on scalar object and array root properties
model: gpt-5
allowed_skills:
  - name: default-reviewSkill
  - name: default-auditSkill
output_schema:
  type: object
  properties:
    ResultValue:
      type: string
      x-loomspan-evidence: default-reviewSkill
    details:
      type: object
      x-loomspan-evidence: default-reviewSkill and default-auditSkill
      properties:
        note: { type: string }
    rows:
      type: array
      x-loomspan-evidence: default-reviewSkill or default-auditSkill
      items: { type: string }
    unconstrained:
      type: string
  required: [ResultValue]
  additionalProperties: false
