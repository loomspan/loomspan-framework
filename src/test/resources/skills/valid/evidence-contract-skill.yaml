name: evidenceContractSkill
description: Skill with an evidence contract
model: gpt-5
allowed_skills:
  - name: default-invoiceParser
  - name: default-expenseLookup
output_schema:
  type: object
  additionalProperties: false
  properties:
    vendorName:
      type: string
      evidence: default-invoiceParser
    isDuplicate:
      type: boolean
      evidence: default-invoiceParser and default-expenseLookup
  required:
    - vendorName
    - isDuplicate
output_schema_max_retries: 1
