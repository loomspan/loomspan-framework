name: evidence-contract-skill
description: Skill with an evidence contract
model: gpt-5
allowed_skills:
  - name: default:invoice-parser
  - name: default:expense-lookup
output_schema:
  type: object
  additionalProperties: false
  properties:
    vendorName:
      type: string
      x-loomspan-evidence: default:invoice-parser
    isDuplicate:
      type: boolean
      x-loomspan-evidence: default:invoice-parser and default:expense-lookup
  required:
    - vendorName
    - isDuplicate
output_schema_max_retries: 1
